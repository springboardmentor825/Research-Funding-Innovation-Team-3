services:
  postgres:
    image: postgres:16
    container_name: innovafund-postgres
    restart: always
    environment:
      POSTGRES_USER: innovafund_user
      POSTGRES_PASSWORD: innovafund_pass
      POSTGRES_DB: innovafund_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: innovafund-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: